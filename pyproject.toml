[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Steel & Code Forge -- orchestration layer"
requires-python = ">=3.11"
# No runtime dependencies. The classifier is stdlib-only by design: the
# security layer should not pull in a third-party dependency tree.
dependencies = []

[project.optional-dependencies]
# Everything needed to run the whole test suite, including the Workbench UI and
# security tests. Kept complete on purpose: a UI test that needs a package the
# dev extra does not provide is a UI test that gets skipped, and a skipped
# approval or CSRF test is one that has quietly stopped protecting anything.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# The Workbench UI server and nothing else. `forge` core stays dependency-free,
# so this extra is only for operators who want the browser surface; an install
# without it runs the full safety stack on the standard library alone.
workbench = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# The terminal entry point. Forge is terminal-first, so `forge` is the command
# an operator actually types; the package is installed rather than run as a
# module. `main` returns an exit code rather than calling sys.exit, so the
# console-script wrapper stays trivial and tests can call it directly.
[project.scripts]
forge = "forge.cli.main:main"

[tool.setuptools.packages.find]
include = ["forge*"]

# The Workbench page, its script, and its stylesheet are served from the
# installed package, not from the source tree. Without this, an editable
# install works and a real wheel silently ships a page with no CSS or JS --
# because `[tool.setuptools.packages.find]` collects modules, and a bare
# `static/` directory is not one.
[tool.setuptools.package-data]
"forge.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"